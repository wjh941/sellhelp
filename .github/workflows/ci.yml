name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements-test.txt
      - run: >
          python -m pytest -q
          --ignore=tests/test_desktop_bundle.py
          --ignore=tests/test_desktop_runtime.py
          --ignore=tests/test_desktop_startup.py
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements-desktop-test.txt
      - run: >
          python -m pytest -q
          tests/test_desktop_bundle.py
          tests/test_desktop_runtime.py
          tests/test_desktop_startup.py
        working-directory: backend
